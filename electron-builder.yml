appId: com.opentcs.sidecar-monitor
productName: Sidecar Monitor
executableName: sidecar-monitor
copyright: Copyright © 2026

directories:
  output: release
  buildResources: resources

files:
  - out/**/*
  - package.json

extraResources:
  - from: resources/icon.png
    to: icon.png

mac:
  icon: resources/icon.icns
  category: public.app-category.utilities
  artifactName: sidecar-monitor-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

dmg:
  icon: resources/icon.icns

win:
  icon: resources/icon.ico
  artifactName: sidecar-monitor-${version}-${arch}.${ext}
  target:
    - target: nsis
      arch: [x64]

linux:
  icon: resources/icons
  category: Utility
  maintainer: huluohu <fooololo@gmail.com>
  syncDesktopName: true
  synopsis: Multi-site Sidecar monitor
  artifactName: sidecar-monitor-${version}-${arch}.${ext}
  target:
    - AppImage
    - deb
    - rpm

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerLanguages: [en_US]
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico

publish: null
